services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: .env
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      args:
        # Tells the Vite build where to reach the backend from the host browser.
        VITE_BACKEND_URL: http://localhost:8000
    ports:
      - "5173:8080"
    depends_on:
      - backend

